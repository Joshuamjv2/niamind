[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "niamind-backend"
version = "0.1.0"
requires-python = "==3.12.*"

[tool.ruff]
line-length = 252

[tool.fastapi]
entrypoint = "api.main:app"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.pycodestyle]
max-line-length = 252

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["F401"]

[tool.pytest.ini_options]
addopts = "--cache-clear"
asyncio_mode = "auto"


[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "db*",
    "migrations*",
    "redis_client*",
]