services:
  db:
    image: postgres:15-alpine

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: niamind_test

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d niamind_test"]
      interval: 3s
      timeout: 3s
      retries: 5

    networks:
      - niamind-test-network

  redis:
    image: redis:7.2-alpine

    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --requirepass redis_password_123

    ports:
      - "6380:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "redis_password_123",
          "ping"
        ]
      interval: 3s
      timeout: 3s
      retries: 5

    networks:
      - niamind-test-network

networks:
  niamind-test-network:
    driver: bridge
