name: Backend Pipeline

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  backend-test-suite:
    name: Lint and Run Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure Docker Compose is Available
        run: |
          docker compose version

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install \
              pytest \
              pytest-asyncio \
              pytest-docker \
              ruff \
              phonenumbers \
              sqlalchemy \
              asyncpg \
              pydantic-settings \
              httpx \
              redis
          fi

      - name: Pre-test Lint Check
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest Suite
        working-directory: backend
        env:
          # ── App ─────────────────────────────────────────────
          APP_NAME: "Niamind"
          APP_ENV: "ci"
          API_VERSION: "v1"
          DEBUG: "False"
          SECRET_KEY: "ci-pipeline-temporary-stub-key"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"

          # ── Database ────────────────────────────────────────
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgres"
          POSTGRES_DB: "niamind_test"

          # Tests run on the GitHub runner.
          # PostgreSQL is provided by docker-compose.test.yml.
          DB_URL: "postgresql+asyncpg://postgres:postgres@localhost:5433/niamind_test"
          TEST_DB_URL: "postgresql+asyncpg://postgres:postgres@localhost:5433/niamind_test"

          # ── Redis ───────────────────────────────────────────
          REDIS_URL: "redis://:redis_password_123@localhost:6380/0"
          TEST_REDIS_URL: "redis://:redis_password_123@localhost:6380/4"

          REDIS_HOST: "localhost"
          REDIS_PORT: 6380
          REDIS_PASSWORD: "redis_password_123"

          REDIS_CACHE_DB: 0
          REDIS_PUBSUB_DB: 1
          REDIS_CELERY_DB: 2
          REDIS_CELERY_RESULTS_DB: 3
          REDIS_TEST_DB: 4

          # ── Celery ──────────────────────────────────────────
          CELERY_BROKER_URL: "redis://:redis_password_123@localhost:6380/2"
          CELERY_RESULT_BACKEND: "redis://:redis_password_123@localhost:6380/3"
          CELERY_TASK_SERIALIZER: "json"
          CELERY_RESULT_SERIALIZER: "json"
          CELERY_TIMEZONE: "UTC"

          # ── Auth ────────────────────────────────────────────
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REFRESH_TOKEN_EXPIRE_DAYS: 30
          ALGORITHM: "HS256"

          # ── Email ───────────────────────────────────────────
          EMAIL_HOST: ""
          EMAIL_PORT: 587
          EMAIL_USERNAME: ""
          EMAIL_PASSWORD: ""
          EMAIL_FROM: "contact@niamind.com"
          EMAIL_TLS: "True"

          # ── Kafka ────────────────────────────────────────────
          KAFKA_BOOTSTRAP_SERVERS: "localhost:9092"
          KAFKA_ENABLED: "False"

          # ── Monitoring ──────────────────────────────────────
          FLOWER_PORT: 5555
          SENTRY_DSN: ""

        run: |
          pytest --cache-clear
