<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <!-- Responsive setup -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Brand title -->
    <title>Niamind | Support for everyone, by everyone</title>

    <!-- Basic SEO (MVP level but intentional) -->
    <meta name="description"
        content="Niamind is a mental health marketplace where access is shared through community contribution." />

    <!-- Open Graph (for link previews later) -->
    <meta property="og:title" content="Niamind" />
    <meta property="og:description" content="Support for everyone, by everyone." />
    <meta property="og:type" content="website" />

    <!-- Favicon (temporary placeholder — will be replaced with your symbol logo) -->
    <link rel="icon" type="image/svg+xml" href="/niamind-icon.svg" />

    <!-- Preload font strategy (optional but clean) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Prevent flash of unstyled content -->
    <style>
        html {
            background-color: #F4F6F8;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <!-- React entry -->
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
